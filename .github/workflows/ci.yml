name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder: il build non esegue chiamate reali (pagine dynamic),
      # ma i client Supabase/Stripe richiedono valori con formato valido.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      ANTHROPIC_API_KEY: sk-ant-placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      RESEND_API_KEY: re_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Typecheck su ciò che è COMMITTATO — previene la classe di incidenti
      # "route e prompt con firme incoerenti tra working tree e HEAD"
      # (vedi .agents/architecture-map.md §2.8, produzione rotta 24h)
      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Build
        run: npm run build
